[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wsi-tiler-qc-engine"
version = "2.0.0"
description = "WSI-Tiler Sentinel: Autonomous Gigapixel Slide Tiling, Focus Mapping & Artifact Filter"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["agents", "wsi_tiler_qc_agent"]
py-modules = ["cli", "wsi_tiler_qc", "enrichment", "simulator"]

[project.scripts]
wsi-tiler-qc-engine = "wsi_tiler_qc_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/wsi-tiler-qc-agent"
Repository = "https://github.com/abusuraihsakhri/wsi-tiler-qc-engine.git"
